name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET 9
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: "9.0.x"
    
    - name: Restore
      run: dotnet restore
    
    - name: Build
      run: dotnet build --configuration Release --no-restore
    
    - name: Publish Runia
      run: dotnet publish Runia/Runia.csproj -c Release -r win-x64 -p:PublishSingleFile=true -p:SelfContained=true --output publish/app
    
    - name: Publish Updater
      run: dotnet publish Updater/Updater.csproj -c Release -r win-x64 -p:PublishSingleFile=true --output publish
    
    - name: Copy docs
      run: |
        Copy-Item "Doc/RELEASE_NOTES.md" -Destination "publish/"
        Copy-Item "THIRD_PARTY_LICENSES.txt" -Destination "publish/"
        Copy-Item "publish/app/Runia.exe" -Destination "publish/" -Force
    
    - name: Archive
      run: Compress-Archive -Path "publish/*" -DestinationPath "Release.zip" -Force
